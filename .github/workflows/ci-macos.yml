# Multiplex app CI. macos-27 carries Xcode 27 and the visionOS 27 simulator
# runtime; the app targets visionOS 26 / iOS 17, so nothing older will do.
#
# Everything this workflow runs is a Tools/build.sh subcommand — the same
# entry point AGENTS.md points contributors at, so CI cannot drift into its
# own private set of destinations and flags.
name: CI / macOS

on:
  push:
    branches:
      - main
    # These files cannot affect linting, project generation, or an app build.
    # If a commit also changes app/build inputs, the workflow still runs.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "fastlane/**"
      - ".agents/**"
      - ".claude/**"
      - ".github/workflows/ci-linux.yml"
      - "local-plan/**"
      - ".gitignore"
      - "Gemfile"
      - "Gemfile.lock"
      - "LICENSE"
      - "NOTICE"
      - "Tools/check-metadata.rb"
      - "Tools/metadata_limits.rb"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "fastlane/**"
      - ".agents/**"
      - ".claude/**"
      - ".github/workflows/ci-linux.yml"
      - "local-plan/**"
      - ".gitignore"
      - "Gemfile"
      - "Gemfile.lock"
      - "LICENSE"
      - "NOTICE"
      - "Tools/check-metadata.rb"
      - "Tools/metadata_limits.rb"
  workflow_dispatch:

# A newer push to the same branch supersedes this run; a macOS run
# is not worth spending on a commit that has already been replaced. `main` is
# exempt so its history keeps a result per commit.
concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # SwiftLint reads the sources directly; it needs neither the generated
  # project nor a build, so it runs beside the platform legs, not ahead of them.
  lint:
    name: Lint
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: ./Tools/build.sh lint

  # One runner per platform: each leg has its own DerivedData, so the build-DB
  # lock that keeps a laptop's visionOS and iPad builds sequential does not
  # apply here. `test` builds the app target too, but building first keeps a
  # compile error reported as a build failure.
  xcode:
    name: Build, test (${{ matrix.name }})
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      # A failure on one platform should not hide the other's result.
      fail-fast: false
      matrix:
        include:
          - platform: vos
            name: visionOS
          - platform: ipad
            name: iPad
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 27.1

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -E 'iOS|visionOS'

      # The xcode-27 image ships Xcode without the Metal Toolchain, which the
      # vendored SwiftTerm's Shaders.metal needs
      # (https://github.com/actions/runner-images/issues/14548).
      - name: Install the Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Install XcodeGen
        run: brew install xcodegen

      # Citadel is the one dependency fetched over the network (SwiftTerm and
      # swift-nio-ssh are vendored in-tree). Cache its checkout so a CI run is
      # not at the mercy of a git host.
      - name: Cache Swift package checkouts
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      # The tailscale-rs static archives are git-ignored (~115 MB for the four
      # slices). The script pins the upstream commit and both toolchains, so
      # its hash plus the patch and header fully determine the output.
      - name: Cache tailscale-rs archives
        id: tailscale-rs
        uses: actions/cache@v4
        with:
          path: Vendor/tailscale-rs/lib
          key: tailscale-rs-${{ runner.os }}-${{ hashFiles('Tools/build-tailscale-rs.sh', 'Vendor/tailscale-rs/patches/**', 'Vendor/tailscale-rs/include/tailscale.h') }}

      - name: Build tailscale-rs archives
        if: steps.tailscale-rs.outputs.cache-hit != 'true'
        run: ./Tools/build-tailscale-rs.sh

      - name: Generate the Xcode project
        run: ./Tools/build.sh gen

      - name: Build (${{ matrix.name }})
        run: ./Tools/build.sh build ${{ matrix.platform }}

      - name: Test (${{ matrix.name }})
        run: ./Tools/build.sh test ${{ matrix.platform }}
