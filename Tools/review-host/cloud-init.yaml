#cloud-config
# Reviewer demo host for Multiplex App Review — the NO-DOCKER path (option B
# in README.md; the Dockerfile is option A and the recommended one). Render
# with ./render.sh — it injects the hashed demo password from fastlane/.env —
# then paste the output as user-data when creating the VM. Ubuntu 24.04 LTS.
#
# ⚠ The demo scripts below are embedded copies of scripts/* (Docker uses
# those directly). If you touch one side, mirror the other.
#
# What this provisions:
#   - user `review`: password SSH login (only user with password auth),
#     no sudo, every SSH forwarding surface disabled
#   - tmux + mosh-server, demo sessions reseeded on boot and nightly
#   - herdr (the app's second session backend), pinned + checksummed, with
#     its own demo sessions seeded by the same reseed
#   - egress-blocked firewall (DNS/NTP/DHCP/apt only), fail2ban

hostname: multiplex-review
locale: C.UTF-8                    # mosh-server refuses non-UTF-8 locales
package_update: true
package_upgrade: true
# locales-all: a mosh client forwards its own locale via `mosh-server -l
# LC_ALL=…` (bypassing sshd's AcceptEnv entirely); if that locale is missing
# server-side, the detached mosh-server dies silently after MOSH CONNECT and
# every mosh session fails. Found live on the GCP host, 2026-07-18.
packages: [tmux, mosh, vim, htop, fail2ban, ufw, locales-all, python3]

ssh_pwauth: false                  # global off; Match block opens it for `review` only

users:
  - default
  - name: review
    shell: /bin/bash
    lock_passwd: false
    # deliberately: no sudo, no groups — the account can run tmux and nothing else

chpasswd:
  expire: false
  users:
    - name: review
      password: __DEMO_PASSWORD_HASH__

write_files:
  - path: /etc/ssh/sshd_config.d/60-review.conf
    content: |
      # Password auth exists ONLY for the App Review account, with every
      # forwarding surface closed so leaked credentials can't turn the box
      # into a proxy.
      Match User review
          PasswordAuthentication yes
          AllowTcpForwarding no
          AllowAgentForwarding no
          AllowStreamLocalForwarding no
          X11Forwarding no
          PermitTunnel no

  - path: /usr/local/bin/demo-server-log
    permissions: "0755"
    content: |
      #!/bin/bash
      while true; do
        printf '%s  api  GET /v1/sessions 200  %dms\n' "$(date +%T)" $((RANDOM % 90 + 10))
        sleep 2
      done

  - path: /usr/local/bin/demo-worker-log
    permissions: "0755"
    content: |
      #!/bin/bash
      while true; do
        printf '%s  worker  job=%d  done\n' "$(date +%T)" $((RANDOM % 900 + 100))
        sleep 3
      done

  - path: /usr/local/bin/demo-build-loop
    permissions: "0755"
    content: |
      #!/bin/bash
      while true; do
        for m in core probe wall terminal input themes sync; do
          printf '  compiling %-10s' "$m"; sleep 1; printf ' ✓\n'
        done
        printf '\nbuild ok · 7 modules\n\n'; sleep 8
      done

  # The agent-detection stubs, same shape as Tools/dev-sshd/harness.sh demo
  # (and disclosed as stubs in the App Review notes): `cat` echoes whatever a
  # helper chip types, so the reviewer sees the command land in the pane.
  - path: /usr/local/bin/demo-agent-cc
    permissions: "0755"
    content: |
      #!/bin/bash
      printf '\033]2;✳ Claude Code\033\\'
      exec -a claude cat

  - path: /usr/local/bin/demo-agent-cx
    permissions: "0755"
    content: |
      #!/bin/bash
      exec -a codex cat

  - path: /usr/local/bin/demo-agent-pi
    permissions: "0755"
    content: |
      #!/bin/bash
      printf '\033]2;π - review\033\\'
      exec -a pi cat

  - path: /usr/local/bin/install-herdr
    permissions: "0755"
    content: |
      #!/bin/bash
      # Install the pinned herdr release binary (herdr.dev) on the reviewer demo
      # host, so the box demonstrates Multiplex's HERDR session backend as well as
      # tmux. Runs as root, idempotent — an already-pinned binary is left alone.
      #
      # Pinned, never "latest": the app parses herdr's socket API (protocol 17,
      # written against 0.7.5) and a review host must not drift under a live
      # submission. Upstream ships one static-pie binary per arch with no checksum
      # file, so the hashes below were taken from the v0.7.5 assets on 2026-08-02
      # and are verified before anything is installed. When bumping the version,
      # recompute both.
      #
      # The install is a provisioning-time download: the running host's egress is
      # firewalled, which is fine — herdr itself needs no network (its clients and
      # server talk over a Unix socket) and `herdr update` is never run here.
      set -euo pipefail

      VERSION=0.7.5
      case "$(uname -m)" in
        x86_64|amd64)
          ASSET=herdr-linux-x86_64
          SHA=3dc83288073e4c2d3c679a30e7be97bcca9141c6fd17dbbb9219142e95c59253 ;;
        aarch64|arm64)
          ASSET=herdr-linux-aarch64
          SHA=32e763a1499a6b694b1d708e4f062b743be1da9f34fcfa4d212d6db6fe09a8b9 ;;
        *)
          echo "herdr: no published binary for $(uname -m) — skipping" >&2; exit 0 ;;
      esac

      DEST=/usr/local/bin/herdr
      if [ -x "$DEST" ] && "$DEST" --version 2>/dev/null | grep -Fq "herdr $VERSION"; then
        echo "herdr $VERSION already installed"
        exit 0
      fi

      TMP="$(mktemp -d)"; trap 'rm -rf "$TMP"' EXIT
      curl -fsSL --retry 3 -o "$TMP/herdr" \
        "https://github.com/herdrdev/herdr/releases/download/v$VERSION/$ASSET"
      echo "$SHA  $TMP/herdr" | sha256sum -c - >/dev/null || {
        echo "herdr: checksum mismatch for $ASSET — refusing to install" >&2; exit 1
      }
      install -m 755 "$TMP/herdr" "$DEST"
      "$DEST" --version

  - path: /usr/local/bin/seed-review-sessions
    permissions: "0755"
    content: |
      #!/bin/bash
      # Reset and reseed the reviewer's tmux sessions. Runs as root
      # (@reboot + nightly cron); the sessions belong to `review`.
      set -u
      pkill -u review 2>/dev/null || true
      sleep 1
      rm -rf /home/review/project
      su - review -s /bin/bash <<'SEED'
      mkdir -p ~/project
      printf '# notes\n\n- check deploy at 15:00\n- rotate api key\n' > ~/project/notes.md
      tmux new-session -d -s main -n editor
      tmux send-keys -t main:0 'vim ~/project/notes.md' Enter
      tmux new-window -t main:1 -n server /usr/local/bin/demo-server-log
      tmux new-window -t main:2 -n logs /usr/local/bin/demo-worker-log
      tmux select-window -t main:1
      tmux new-session -d -s build /usr/local/bin/demo-build-loop
      tmux new-session -d -s logs /usr/local/bin/demo-worker-log
      tmux new-session -d -s agent -n cc /usr/local/bin/demo-agent-cc
      tmux new-window -t agent:1 -n cx /usr/local/bin/demo-agent-cx
      tmux new-window -t agent:2 -n pi /usr/local/bin/demo-agent-pi
      tmux select-window -t agent:0
      SEED

      # The HERDR-backend half of the same demo (skips itself where herdr
      # isn't installed). It runs after the pkill above, so it always starts
      # from a dead herdr server — a reseed is a full reset for both backends.
      su - review -s /bin/bash -c /usr/local/bin/seed-review-herdr || \
          echo "seed-review-herdr failed — tmux sessions are still seeded" >&2

  - path: /usr/local/bin/seed-review-herdr
    permissions: "0755"
    content: |
      #!/usr/bin/env python3
      """Seed the reviewer's herdr sessions — the HERDR-backend analog of the tmux
      sessions in seed-review-sessions, and its sibling: seed-review-sessions runs
      this as `review` after the tmux seed, and a host with no herdr binary simply
      skips it.

      Three tiles, matching the tmux story so the review notes can describe one
      demo either way:

        default  herdr's protected primary session (a plain shell; the app's
                 blind-attach fallback), left running so the wall isn't empty
        main     `editor` + `logs` workspaces — the deck draws them as that
                 tile's window spine — the second streaming the worker log
        agent    three workspaces running the same agent-detection stubs as the
                 tmux `agent` session (cc/cx/pi), each reporting a herdr agent
                 lifecycle state, so RUNNING / NEEDS YOU / idle are reproducible

      Wire facts this leans on (herdr 0.7.5 / protocol 17, same set the app's
      HerdrProbe documents): `session attach <name>` auto-creates and auto-starts,
      and without a TTY the client exits *after* the session server daemonizes;
      every socket verb scopes with the global `--session` flag; a fresh session's
      first pane is `w1:p1`; reportable states are idle|working|blocked|unknown.
      """

      import json
      import os
      import pathlib
      import shlex
      import shutil
      import subprocess
      import sys
      import time

      SESSIONS = ["main", "agent"]
      DEVNULL = subprocess.DEVNULL
      LOG = pathlib.Path.home() / "herdr-server.log"
      SHELLS = {"sh", "bash", "zsh", "dash", "fish", "csh", "tcsh"}


      def herdr(session, *args, check=True, capture=False):
          return subprocess.run(["herdr", "--session", session, *args],
                                capture_output=capture, text=True, check=check)


      def server_running():
          probe = subprocess.run(["herdr", "status", "--json"],
                                 capture_output=True, text=True, check=False)
          return '"running":true' in probe.stdout.replace(" ", "")


      def start_default_server():
          """The default session is the one tile the app can attach blind."""
          if server_running():
              return
          with LOG.open("ab") as log:
              subprocess.Popen(["herdr", "server"], stdin=DEVNULL, stdout=log,
                               stderr=log, start_new_session=True)
          for _ in range(25):
              if server_running():
                  return
              time.sleep(0.4)
          sys.exit(f"herdr server never came up — see {LOG}")


      def spawn(session):
          """Recreate a session from scratch: a reseed must not stack workspaces."""
          for verb in ("stop", "delete"):
              subprocess.run(["herdr", "session", verb, session],
                             stdout=DEVNULL, stderr=DEVNULL, check=False)
          subprocess.run(["herdr", "session", "attach", session],
                         stdin=DEVNULL, stdout=DEVNULL, stderr=DEVNULL, check=False)
          for _ in range(20):
              if herdr(session, "api", "snapshot",
                       check=False, capture=True).returncode == 0:
                  return
              time.sleep(0.3)
          sys.exit(f"herdr session {session} never answered its socket")


      def workspace(session, label, cwd, focus=False):
          """`--no-focus` by default: a session carries ONE focus every client
          mirrors, and the seed should leave each tile on its first workspace."""
          out = herdr(session, "workspace", "create", "--cwd", cwd, "--label", label,
                      "--focus" if focus else "--no-focus", capture=True).stdout
          result = json.loads(out)["result"]
          return result["workspace"]["workspace_id"], result["root_pane"]["pane_id"]


      def rename(session, workspace_id, label):
          """A session's first workspace is labelled after its cwd; the deck draws
          those labels as the tile's window spine, so name them like tmux's."""
          herdr(session, "workspace", "rename", workspace_id, label,
                check=False, capture=True)


      def foreground_argv0s(session, pane):
          """argv[0] of every foreground process, however this herdr spells it:
          0.7.5 reports an `argv0` string on macOS but an `argv` list on Linux
          (`name` is the executable — `cat` for our `exec -a <kind> cat` stubs —
          so it is deliberately the last resort)."""
          out = herdr(session, "pane", "process-info", "--pane", pane,
                      check=False, capture=True)
          try:
              info = json.loads(out.stdout)["result"]["process_info"]
              processes = info["foreground_processes"]
          except (KeyError, TypeError, ValueError):
              return []
          argv0s = []
          for process in processes:
              argv0 = process.get("argv0")
              if not argv0:
                  argv = process.get("argv") or (process.get("cmdline") or "").split()
                  argv0 = argv[0] if argv else process.get("name")
              argv0s.append(str(argv0 or ""))
          return argv0s


      def wait_for_shell(session, pane):
          for _ in range(30):
              argv0s = foreground_argv0s(session, pane)
              if len(argv0s) == 1:
                  if pathlib.Path(argv0s[0].lstrip("-")).name in SHELLS:
                      return
              time.sleep(0.2)


      def run(session, pane, command, expect=None):
          """Type a command into a pane the way a person would, then (optionally)
          require its process to prove it is live — the seed must never claim an
          agent over a shell prompt that swallowed the line."""
          wait_for_shell(session, pane)
          herdr(session, "pane", "send-text", pane, command)
          herdr(session, "pane", "send-keys", pane, "Enter")
          if expect is None:
              return
          for attempt in range(20):
              if expect in foreground_argv0s(session, pane):
                  return
              if attempt == 5:
                  herdr(session, "pane", "send-keys", pane, "Enter")
              time.sleep(0.3)
          sys.exit(f"herdr {session} pane {pane} never launched {expect}")


      def report(session, pane, agent, state, message=None):
          herdr(session, "pane", "report-agent", pane, "--source", "multiplex-review",
                "--agent", agent, "--state", state,
                *(["--message", message] if message else []))


      if shutil.which("herdr") is None:
          print("herdr not installed — skipping herdr seed")
          sys.exit(0)

      home = str(pathlib.Path.home())
      project = os.path.join(home, "project")
      start_default_server()
      for name in SESSIONS:
          spawn(name)

      # `herdr server` brings the default session up empty — a tile with nothing to
      # show. Give it the plain shell a person attaching blind would expect.
      if not json.loads(herdr("default", "workspace", "list",
                              capture=True).stdout)["result"]["workspaces"]:
          workspace("default", "shell", home, focus=True)

      # main: the tmux demo's shape — an editor pane plus a second workspace with
      # live output, so the tile has both a window spine and a moving miniature.
      rename("main", "w1", "editor")
      # `-R -n`: the tmux demo already holds this file open in its own vim, and a
      # second writable vim lands on the E325 swap-file prompt instead of the notes.
      run("main", "w1:p1",
          f"vim -R -n {shlex.quote(os.path.join(project, 'notes.md'))}", expect="vim")
      _, logs_pane = workspace("main", "logs", project)
      run("main", logs_pane, "/usr/local/bin/demo-worker-log")

      # agent: the disclosed stubs, each with the herdr lifecycle state a real
      # integration would report through the same door. Every stub is `exec -a
      # <kind> cat`, so the kind doubles as the argv0 the pane must show before the
      # state is reported.
      for label, stub, kind, state, message in [
          ("cc", "demo-agent-cc", "claude", "working", None),
          ("cx", "demo-agent-cx", "codex", "blocked", "Allow command: npm run deploy?"),
          ("pi", "demo-agent-pi", "pi", "idle", None),
      ]:
          if label == "cc":
              pane = "w1:p1"
              rename("agent", "w1", label)
          else:
              _, pane = workspace("agent", label, project)
          run("agent", pane, f"/usr/local/bin/{stub}", expect=kind)
          report("agent", pane, kind, state, message)

      print("herdr sessions seeded:", ", ".join(["default", *SESSIONS]))

  - path: /etc/cron.d/review-reseed
    content: |
      # Reseed demo sessions on boot and nightly at 08:00 UTC (midnight
      # Pacific — App Review works US Pacific hours).
      @reboot root /usr/local/bin/seed-review-sessions
      0 8 * * * root /usr/local/bin/seed-review-sessions

runcmd:
  - systemctl restart ssh
  # herdr ships as a GitHub release download (ufw's 443 allowance below keeps
  # that working on a redeploy too); a failure must not fail provisioning —
  # the herdr seed skips itself when the binary is absent.
  - /usr/local/bin/install-herdr || true
  - ufw default deny incoming
  - ufw default deny outgoing
  - ufw allow in 22/tcp
  - ufw allow in 60000:61000/udp        # mosh
  - ufw allow out 53                    # DNS
  - ufw allow out 123/udp               # NTP
  - ufw allow out 67:68/udp             # DHCP lease renewal
  # The review account is a real shell: keep the metadata server (and the
  # service-account token it hands out) out of reach. Ordered above the web
  # allowances, below the DNS one — GCP's resolver is this same address.
  - ufw deny out proto tcp to 169.254.169.254
  - ufw allow out 80/tcp                # apt / unattended-upgrades
  - ufw allow out 443/tcp
  - ufw --force enable
  - /usr/local/bin/seed-review-sessions
