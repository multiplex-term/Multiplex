# Demo-container sshd policy. Ubuntu's sshd_config includes this directory
# first, and sshd honors the FIRST value it reads — so these globals win.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers review
MaxAuthTries 3
LoginGraceTime 20
MaxStartups 6:50:12
X11Forwarding no
HostKey /etc/ssh/hostkeys/ssh_host_ed25519_key
HostKey /etc/ssh/hostkeys/ssh_host_rsa_key

# The one password login, with every tunnel/forwarding surface closed so
# leaked credentials can't turn the box into a proxy.
Match User review
    PasswordAuthentication yes
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
