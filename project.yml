name: Multiplex
options:
  bundleIdPrefix: app.multiplexterm
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    visionOS: "1.0"

packages:
  # Vendored 1.13.0 (rev 8e7a1e1, MIT) with one patch: keyboardType is
  # settable so the terminal can default to an ASCII-capable (English)
  # keyboard instead of the user's IME.
  SwiftTerm:
    path: Vendor/SwiftTerm
  # Pinned to 0.12.0 on purpose: 0.12.1 moved its swift-nio-ssh dependency to
  # an unaudited personal fork. Review before upgrading (see README).
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: 0.12.0
  # Local override of Citadel's swift-nio-ssh fork (same package identity):
  # vendored at the exact resolved revision with a one-line manifest fix —
  # the NIOSSH target uses `import NIO` without declaring the product.
  swift-nio-ssh:
    path: Vendor/swift-nio-ssh

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: C6EUM5DVB3
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Citadel's swift-nio-ssh fork imports the NIO umbrella module without
    # declaring it as a target dependency; explicit module builds reject that.
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
    _EXPERIMENTAL_SWIFT_EXPLICIT_MODULES: NO

targets:
  Multiplex:
    type: application
    supportedDestinations: [iOS, visionOS]
    sources:
      - path: Multiplex
      - path: AppIcon.icon
      - path: Assets.xcassets
    dependencies:
      - package: SwiftTerm
      - package: Citadel
      - package: swift-nio-ssh
        product: NIOSSH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.multiplexterm.multiplex
        PRODUCT_NAME: Multiplex
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "2,7"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        # Export compliance: the app IMPLEMENTS standard crypto (vendored
        # swift-nio-ssh + clean-room AES-128-OCB3 for mosh), so it is
        # non-exempt → YES, self-classified mass-market 5D992.c via the
        # one-time App Encryption Documentation declaration in ASC (see
        # docs/appstore/release-playbook.md → Export compliance).
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: YES
        INFOPLIST_KEY_CFBundleDisplayName: Multiplex
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Multiplex connects to SSH hosts on your local network.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight

  MultiplexTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, visionOS]
    sources:
      - path: MultiplexTests
    dependencies:
      - target: Multiplex
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
