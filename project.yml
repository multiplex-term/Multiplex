name: Multiplex
options:
  bundleIdPrefix: app.multiplexterm
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    visionOS: "1.0"

packages:
  # Vendored 1.15.0 (rev dd2fb8a, MIT). Multiplex keeps keyboardType settable
  # and `.default` for multilingual/IME input, routes pans to remote scrolling
  # and copy mode, suppresses obscured-tab redraws, keeps UIKit composition
  # visible, and preserves iOS-app-on-Mac Escape and hardware Ctrl chords.
  # Primary-button tap reporting is upstream as of this release.
  SwiftTerm:
    path: Vendor/SwiftTerm
  # Pinned to 0.12.0 on purpose: 0.12.1 moved its swift-nio-ssh dependency to
  # an unaudited personal fork. Review before upgrading (see README).
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: 0.12.0
  # Local override of Citadel's swift-nio-ssh fork (same package identity):
  # vendored at the exact resolved revision with a one-line manifest fix —
  # the NIOSSH target uses `import NIO` without declaring the product.
  swift-nio-ssh:
    path: Vendor/swift-nio-ssh

# Developer-only StoreKit catalog. It is referenced by the run scheme rather
# than copied into the app; release builds fetch the matching product from the
# App Store.
fileGroups:
  - Multiplex.storekit

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: C6EUM5DVB3
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Citadel's swift-nio-ssh fork imports the NIO umbrella module without
    # declaring it as a target dependency; explicit module builds reject that.
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
    _EXPERIMENTAL_SWIFT_EXPLICIT_MODULES: NO

schemes:
  Multiplex:
    build:
      targets:
        Multiplex: all
    run:
      config: Debug
      storeKitConfiguration: Multiplex.storekit
    archive:
      config: Release
  MultiplexTests:
    build:
      targets:
        MultiplexTests: [test]
    test:
      config: Debug
      targets:
        - MultiplexTests

targets:
  Multiplex:
    type: application
    supportedDestinations: [iOS, visionOS]
    sources:
      - path: Multiplex
      - path: AppIcon.icon
      - path: Assets.xcassets
    info:
      path: Multiplex/Info.plist
      properties:
        CFBundleDisplayName: Multiplex
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        # The viewport (inline browser) renders dev servers, which are
        # cleartext http on LAN addresses — blocked by default ATS. This is
        # Apple's web-content-scoped relaxation: WKWebView loads only; every
        # other connection the app makes keeps full ATS (SSH rides NIO and
        # never sees ATS either way).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSCameraUsageDescription: Multiplex uses the camera when you take a photo to send to your remote SSH session, and when you scan the code that binds a machine to the app.
        # Also covers Optic ID on visionOS (there is no separate key).
        NSFaceIDUsageDescription: Multiplex unlocks with Face ID when the optional App Lock setting is turned on.
        NSLocalNetworkUsageDescription: Multiplex connects to SSH hosts on your local network, and finds machines offering to bind themselves to the app.
        # Bind Host discovery: the companion CLI (mpx bind) announces this
        # service while it is offering to pair, and the deck browses for it
        # while the Add Host sheet's Bind pane is open (never in the
        # background — same discipline as the probe feed). Bonjour is the
        # whole discovery mechanism and needs no entitlement, which is why
        # this key is the only declaration binding requires.
        NSBonjourServices:
          - _multiplex-bind._tcp
        # The key rail's dictation key, offered in place of the software
        # keyboard toggle while a hardware keyboard is attached. Both are
        # requested only on the first press of that key.
        NSMicrophoneUsageDescription: Multiplex listens only while you hold a dictation going from the terminal key bar.
        NSSpeechRecognitionUsageDescription: Multiplex transcribes your dictation so the words can be typed into the terminal session you are attached to. Recognition stays on device wherever your language supports it.
        # multiplex://open?host=…&action=shell|agent — widget taps and
        # automation deep links (parsed by ExternalActionURL).
        CFBundleURLTypes:
          - CFBundleURLName: app.multiplexterm.multiplex.actions
            CFBundleURLSchemes: [multiplex]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        # iPhone is single-scene: without this override iOS 27 connects a
        # second (empty) scene on phones, composing two windows into one
        # screen. iPad/visionOS keep multi-scene from the base manifest.
        UIApplicationSceneManifest~iphone:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UILaunchScreen:
          UIColorName: AppBackground
        # The un-suffixed key applies to iPhone; the ~ipad override wins on iPad.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    # The App Group shares the secret-free widget snapshot
    # (SharedStateStore) with the widget extension. Same group on both
    # targets; automatic signing provisions it on device builds.
    entitlements:
      path: Multiplex/Multiplex.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.multiplexterm.multiplex
    dependencies:
      # In-App Purchase capability has no signing entitlement; linking
      # StoreKit is the project-level capability marker, with product setup
      # living in App Store Connect.
      - sdk: StoreKit.framework
      - package: SwiftTerm
      - package: Citadel
      - package: swift-nio-ssh
        product: NIOSSH
      - target: MultiplexWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.multiplexterm.multiplex
        PRODUCT_NAME: Multiplex
        # The one C island: vendored bcrypt-pbkdf (Models/Bind/CBcryptSeal)
        # for sealing a bind's SSH key in OpenSSH's encrypted format.
        # Citadel carries the decrypt side; the app only needed the encrypt
        # side, which no Swift dependency offers.
        SWIFT_OBJC_BRIDGING_HEADER: Multiplex/Multiplex-Bridging-Header.h
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "202607243"
        # One target produces the universal iOS binary (iPhone + iPad) and the
        # separate visionOS binary. Fastlane archives Release, so family 1 must
        # live in the base setting rather than in a Debug-only override.
        TARGETED_DEVICE_FAMILY: "1,2,7"
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          # SwiftUI Canvas requires an unoptimized app module. Keep these
          # explicit so previews cannot inherit an optimized build plan.
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          ENABLE_PREVIEWS: YES
          ENABLE_DEBUG_DYLIB: YES
        # Export compliance: Multiplex implements only published,
        # industry-standard crypto (SSH and AES-OCB). Apple's NO value means
        # "no non-exempt encryption," not "no encryption"; no Apple
        # documentation/code is required unless the app is distributed in
        # France. See docs/appstore/release-playbook.md → Export compliance.

  # WidgetKit extension: Home Screen / Lock Screen widgets on iPad+iPhone,
  # and visionOS 26 widgets. It compiles only Multiplex/Shared (snapshot
  # codec, deep-link builder, App-Intents entity/enum) — never the app's
  # model or transport chain. visionOS's floor is 26.0: WidgetKit does not
  # exist there before it, while the app itself stays visionOS 1.0.
  MultiplexWidgets:
    type: app-extension
    supportedDestinations: [iOS, visionOS]
    sources:
      - path: MultiplexWidgets
      - path: Multiplex/Shared
    entitlements:
      path: MultiplexWidgets/MultiplexWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.multiplexterm.multiplex
    info:
      path: MultiplexWidgets/Info.plist
      properties:
        CFBundleDisplayName: Multiplex
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.multiplexterm.multiplex.widgets
        PRODUCT_NAME: MultiplexWidgets
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "202607170"
        TARGETED_DEVICE_FAMILY: "1,2,7"
        SUPPORTS_MACCATALYST: NO
        # XcodeGen's per-target deploymentTarget does not apply to
        # multi-destination targets, so pin the floors directly: WidgetKit
        # exists on visionOS only from 26.0 (the app itself stays 1.0).
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        XROS_DEPLOYMENT_TARGET: "26.0"

  MultiplexTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, visionOS]
    sources:
      - path: MultiplexTests
      # StoreKit Test reads the same local catalog used by the Debug run
      # scheme, keeping automation and interactive purchase testing aligned.
      - path: Multiplex.storekit
        buildPhase: resources
    dependencies:
      - target: Multiplex
      - sdk: StoreKitTest.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
